name: Personal Mac build

# Builds SharePad.app from this fork on a GitHub-hosted Mac, ad-hoc signed
# (no Developer ID needed), and keeps it as a downloadable artifact.
# Runs on pushes to the my-build branch, or by hand from the Actions tab.
on:
  push:
    branches: [my-build]
  workflow_dispatch:

permissions:
  contents: write # push the zip to the my-build-output branch

jobs:
  build:
    name: Build SharePad.app
    runs-on: macos-26 # same image upstream CI uses: arm64 + Xcode 26.x (Swift 6)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install xcodegen just

      # Upstream `just release-build` plus PERSONAL_BUILD, which compiles out the
      # honor-system trial gate (specs/licensing.md §1, EntitlementClock).
      - name: Build
        run: |
          just gen
          status=0
          xcodebuild -project SharePad.xcodeproj -scheme SharePad -configuration Release \
            -destination 'platform=macOS' -derivedDataPath .build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.3.0 \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) PERSONAL_BUILD' \
            build > build.log 2>&1 || status=$?
          tail -n 40 build.log
          if [ "$status" -ne 0 ]; then
            grep -E "error:|\*\* BUILD FAILED" build.log | sort -u | head -n 20 \
              | sed 's/^/::error::/' || true
            exit "$status"
          fi
          n=$(grep -c -- "-D PERSONAL_BUILD" build.log || true)
          echo "::notice::compiler invocations with -D PERSONAL_BUILD: $n"
          [ "$n" -gt 0 ] || { echo "::error::PERSONAL_BUILD never reached the compiler"; exit 1; }

      # An ad-hoc signature has no Team ID, so with Hardened Runtime on, library
      # validation on a stock Mac refuses the embedded Sparkle.framework ("different
      # Team IDs") even though it is ad-hoc too. Hardened Runtime is only needed for
      # notarization, so a personal build re-signs the bundle ad-hoc without it,
      # inside-out in the same order as `just sign`. Camera access then goes through
      # the normal TCC prompt (NSCameraUsageDescription).
      - name: Re-sign ad-hoc without Hardened Runtime, inside-out
        run: |
          APP=.build/Build/Products/Release/SharePad.app
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          V="$FW/Versions/B"
          codesign --force --sign - "$V/XPCServices/Installer.xpc"
          codesign --force --preserve-metadata=entitlements --sign - "$V/XPCServices/Downloader.xpc"
          codesign --force --sign - "$V/Autoupdate"
          codesign --force --sign - "$V/Updater.app"
          codesign --force --sign - "$FW"
          codesign --force --entitlements Sources/SharePad/SharePad.entitlements --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Record signing details
        run: |
          APP=.build/Build/Products/Release/SharePad.app
          {
            echo "## Runner"; sw_vers; csrutil status || true
            echo "## Trial gate"
            echo "compiler invocations with -D PERSONAL_BUILD: $(grep -c -- '-D PERSONAL_BUILD' build.log)"
            for f in "$APP" "$APP/Contents/Frameworks/Sparkle.framework" \
                     "$APP/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"; do
              echo "## $f"; codesign -dv --verbose=2 "$f" 2>&1 | grep -E "^(Identifier|Format|CodeDirectory|Signature|TeamIdentifier|Runtime)"
            done
            echo "## Entitlements"; codesign -d --entitlements - "$APP" 2>/dev/null
          } | tee build-info.txt

      - name: Smoke test (launches and stays up)
        run: |
          "./.build/Build/Products/Release/SharePad.app/Contents/MacOS/SharePad" > launch.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "SharePad still running after 10s"; kill "$PID"
          else
            echo "SharePad exited within 10s:"; cat launch.log; exit 1
          fi

      - name: Verify app invariants
        run: just verify-app .build/Build/Products/Release/SharePad.app

      - name: Package
        run: |
          ditto -c -k --keepParent \
            .build/Build/Products/Release/SharePad.app SharePad.zip
          shasum -a 256 SharePad.zip | tee SharePad.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: SharePad-app
          path: SharePad.zip
          retention-days: 30

      # Artifact downloads redirect to blob storage some networks can't reach;
      # a branch holding the zip can be fetched with plain git instead.
      - name: Publish the zip to the my-build-output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp SharePad.zip SharePad.zip.sha256 build-info.txt out/ && cd out
          git init -q -b my-build-output
          git add SharePad.zip SharePad.zip.sha256 build-info.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "SharePad.app build ${{ github.run_number }} from ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" my-build-output
