name: Personal Mac build

# Builds SharePad.app from this fork on a GitHub-hosted Mac, ad-hoc signed
# (no Developer ID needed), and keeps it as a downloadable artifact.
# Runs on pushes to the my-build branch, or by hand from the Actions tab.
on:
  push:
    branches: [my-build]
  workflow_dispatch:

permissions:
  contents: write # push the zip to the my-build-output branch

jobs:
  build:
    name: Build SharePad.app
    runs-on: macos-26 # same image upstream CI uses: arm64 + Xcode 26.x (Swift 6)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: brew install xcodegen just

      # Release config, Hardened Runtime, ad-hoc signed (upstream `just release-build`).
      - name: Build
        env:
          RELEASE_VERSION: "1.3.0"
          BUILD_NUMBER: ${{ github.run_number }}
        run: just release-build

      # Sparkle's prebuilt framework keeps its developer's Team ID, which an ad-hoc
      # app under Hardened Runtime refuses to load ("different Team IDs"). Re-sign
      # the bundle ad-hoc, inside-out, in the same order as `just sign`.
      - name: Re-sign ad-hoc, inside-out
        run: |
          APP=.build/Build/Products/Release/SharePad.app
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          V="$FW/Versions/B"
          echo "Before:"; codesign -dv "$FW" 2>&1 | grep -E "^(Identifier|TeamIdentifier|Signature)" || true
          codesign --force --options runtime --sign - "$V/XPCServices/Installer.xpc"
          codesign --force --options runtime --preserve-metadata=entitlements --sign - "$V/XPCServices/Downloader.xpc"
          codesign --force --options runtime --sign - "$V/Autoupdate"
          codesign --force --options runtime --sign - "$V/Updater.app"
          codesign --force --options runtime --sign - "$FW"
          codesign --force --options runtime \
            --entitlements Sources/SharePad/SharePad.entitlements --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "After:"
          for f in "$APP" "$FW"; do codesign -dv "$f" 2>&1 | grep -E "^(Identifier|TeamIdentifier|Signature)"; done

      - name: Smoke test (launches and stays up)
        run: |
          "./.build/Build/Products/Release/SharePad.app/Contents/MacOS/SharePad" > launch.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "SharePad still running after 10s"; kill "$PID"
          else
            echo "SharePad exited within 10s:"; cat launch.log; exit 1
          fi

      - name: Verify app invariants
        run: just verify-app .build/Build/Products/Release/SharePad.app

      - name: Package
        run: |
          ditto -c -k --keepParent \
            .build/Build/Products/Release/SharePad.app SharePad.zip
          shasum -a 256 SharePad.zip | tee SharePad.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: SharePad-app
          path: SharePad.zip
          retention-days: 30

      # Artifact downloads redirect to blob storage some networks can't reach;
      # a branch holding the zip can be fetched with plain git instead.
      - name: Publish the zip to the my-build-output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp SharePad.zip SharePad.zip.sha256 out/ && cd out
          git init -q -b my-build-output
          git add SharePad.zip SharePad.zip.sha256
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "SharePad.app build ${{ github.run_number }} from ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" my-build-output
